[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csob-ceb-business-connector-sdk"
version = "0.1.0"
description = "Python SDK for ČSOB CEB Business Connector"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TODO", email = "TODO@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "zeep>=4.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "cryptography>=42",
    "structlog>=24",
    "platformdirs>=4",
    "certifi>=2024.0",
]

[project.optional-dependencies]
pfx = ["cryptography>=42"]
sqlite = ["sqlalchemy>=2.0"]
async = ["httpx>=0.27", "anyio>=4"]
yaml = ["PyYAML>=6.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "responses>=0.25",
    "requests-mock>=1.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/TODO/csob-ceb-business-connector-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/csob_ceb_bc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/csob_ceb_bc --cov-report=term-missing"
